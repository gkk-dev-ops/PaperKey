name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  metadata:
    name: Compute Build Metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.build_meta.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - id: build_meta
        name: Derive deploy version
        run: |
          base_version="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA::7}"
          app_version="${base_version}-ci.${short_sha}"
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /PaperKey/
          VITE_APP_VERSION: ${{ needs.metadata.outputs.app_version }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
