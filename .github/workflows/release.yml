name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /PaperKey/
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Package dist
        run: cd dist && zip -r ../paperkey-${{ github.ref_name }}.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: paperkey-${{ github.ref_name }}.zip
          generate_release_notes: true
